services:
  mcp-1panel:
    build: .
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PANEL_HOST=${PANEL_HOST}
      - PANEL_ACCESS_TOKEN=${PANEL_ACCESS_TOKEN}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - MCP_ACCESS_LEVEL=${MCP_ACCESS_LEVEL}
    volumes:
      - ./data/tls:/data/tls
    ports:
      - ${PANEL_APP_PORT_HTTP}:8000
    command:
      - -transport
      - streamable-http
      - -addr
      - https://0.0.0.0:8000/mcp
      - -allow-remote-http
      - -tls-dir
      - /data/tls
      - -tls-hosts
      - ${MCP_TLS_HOSTS}
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
