services:
  mcp-1panel:
    build: .
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PANEL_HOST=${PANEL_HOST}
      - PANEL_ACCESS_TOKEN=${PANEL_ACCESS_TOKEN}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - MCP_ACCESS_LEVEL=${MCP_ACCESS_LEVEL}
    ports:
      - 127.0.0.1:${PANEL_APP_PORT_HTTP}:8000
    command:
      - -transport
      - streamable-http
      - -addr
      - http://0.0.0.0:8000/mcp
      - -allow-remote-http
      - -allow-plaintext-http
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
